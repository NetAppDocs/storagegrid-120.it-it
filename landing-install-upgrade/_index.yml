indexpage:
  title: Installa, aggiorna e applica hotfix a StorageGRID
  summary: Un sistema StorageGRID è costituito da singoli nodi basati su hardware
    e su software. Per prima cosa, installi l'hardware per ogni nodo appliance e configuri
    ogni host Linux o VMware. Poi, installi il software StorageGRID su ogni appliance
    o host software e colleghi i nodi in una grid.
